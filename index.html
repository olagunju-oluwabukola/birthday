<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0B3D2E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to 30</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#F7EFD8;--bg1:#0B3D2E;--bg2:#14573F;--gold:#E8B84A;--gold-d:#E8B84A;--sky:#F7EFD8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg1);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
#app,.scene{position:fixed;inset:0}
#app{background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg1) 70%)}
.scene{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:in .7s ease both;overflow:hidden}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
h1{font-weight:800;font-size:clamp(30px,6vw,64px);line-height:1.05;letter-spacing:-.02em;max-width:18ch}
h1.big{font-size:clamp(48px,12vw,140px);max-width:none}
.hype{font-size:clamp(36px,8vw,96px);max-width:16ch}
.small{opacity:.7;margin-bottom:14px;font-size:18px}
.go{color:var(--gold-d);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
button{font:inherit;font-weight:700;font-size:18px;color:#0B3D2E;background:var(--gold);border:0;border-radius:999px;padding:14px 34px;margin-top:28px;cursor:pointer;transition:transform .2s}
button:hover{transform:scale(1.06)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#world{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.step{position:absolute;background:linear-gradient(180deg,#1E7B5B,#16644B 40%,#0F4D3A);border-top:4px solid #3FA37F;border-left:1px solid #ffffff22;color:#F7EFD8;font-weight:700;font-size:14px;padding-top:6px;text-align:center}
.ground{position:absolute;left:-3000px;top:0;width:3000px;height:3000px;background:#0F4D3A;border-top:4px solid #3FA37F}
#angel{position:absolute;width:64px;height:108px}
#angel svg,#angel img{width:100%;height:100%;overflow:visible;display:block;animation:bob .4s ease-in-out infinite alternate}
#angel img{object-fit:contain;object-position:bottom;transform-origin:50% 100%;filter:drop-shadow(0 6px 8px #00000066);animation:rock .4s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-3deg)}to{transform:rotate(3deg) translateY(-6px)}}
#angel svg{filter:drop-shadow(0 6px 6px #00000055)}
.lg{transform-origin:32px 62px;animation:sw .4s ease-in-out infinite alternate}
.lb{animation-direction:alternate-reverse}
.am{transform-origin:32px 38px;animation:sw .4s ease-in-out infinite alternate-reverse}
.ab{animation-direction:alternate}
@keyframes sw{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes bob{to{transform:translateY(-5px)}}
#count{position:absolute;left:50%;top:6vh;transform:translateX(-50%);font-weight:800;font-size:clamp(80px,18vw,180px);line-height:1;color:var(--gold-d);text-shadow:0 0 30px #E8B84A66;z-index:3;font-variant-numeric:tabular-nums}
#count.pop{animation:cp .25s ease}
@keyframes cp{50%{transform:translateX(-50%) scale(1.12)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#F7EFD8;opacity:.35;animation:tw 2.5s infinite alternate}
@keyframes tw{to{opacity:.1}}
#welcome{position:absolute;inset:0;z-index:5;display:flex;flex-wrap:wrap;gap:0 .35em;align-items:center;justify-content:center;align-content:center;padding:20px;font-weight:800;font-size:clamp(54px,13vw,160px);line-height:1;background:radial-gradient(circle,#14573Fee,#0B3D2Ef2)}
#welcome .w{display:flex}
#welcome span.l{display:inline-block;animation:gather .9s cubic-bezier(.2,1.2,.3,1) both}
#welcome .n span.l{color:var(--gold-d)}
@keyframes gather{from{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.2);opacity:0}to{transform:none;opacity:1}}
.balloon{position:fixed;bottom:-160px;width:64px;height:80px;border-radius:50% 50% 48% 48%;z-index:6;pointer-events:none;animation:rise var(--d) ease-in forwards;background:radial-gradient(circle at 30% 30%,#fff9,transparent 35%),var(--c)}
.balloon:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:70px;background:#F7EFD866}
@keyframes rise{to{transform:translate(var(--sx),-135vh) rotate(var(--rot))}}
.conf{position:fixed;z-index:7;width:9px;height:14px;pointer-events:none;animation:fall var(--d) ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
.vwrap{position:relative;width:min(92vw,1000px)}
video{width:100%;max-height:78vh;border-radius:22px;background:#000;box-shadow:0 30px 80px #00000066}
.tag{position:absolute;left:16px;top:16px;z-index:2;background:#0B3D2Ecc;color:#F7EFD8;backdrop-filter:blur(8px);padding:8px 16px;border-radius:999px;font-weight:700}
.ph{width:min(90vw,700px);padding:60px 24px;border:2px dashed #F7EFD866;border-radius:22px;font-size:20px}
.cav{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--c);color:#0B3D2E;font-weight:800;font-size:28px;box-shadow:0 8px 18px #00000055}
@keyframes cardin{from{transform:translateY(50px) rotate(-3deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes wd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.row button{margin:0}
.no{background:#14573F;color:var(--ink);border:2px solid #E8B84A66}
.no.run{position:fixed;transition:left .28s ease,top .28s ease,transform .3s;z-index:20}
#taunt{min-height:30px;margin-top:20px;font-size:clamp(17px,3vw,22px);color:var(--gold-d);font-weight:700}
.chat{width:min(92vw,520px);max-height:68vh;overflow:auto;border-radius:24px;background:#0F4D3A;border:1px solid #F7EFD822;box-shadow:0 30px 80px #00000066;text-align:left;animation:cardin .8s cubic-bezier(.2,1.3,.3,1) both}
.chead{display:flex;gap:12px;align-items:center;padding:12px 16px;background:#0B3D2E;border-bottom:1px solid #F7EFD822}
.chead .cav{margin:0;width:44px;height:44px;font-size:20px;box-shadow:none}
.chead b{display:block;font-size:17px;font-weight:800}
.chead small{font-size:12px;color:#7FD8A8}
.cbody{padding:18px 14px 22px;display:flex;flex-direction:column;gap:7px;min-height:160px}
.bub{align-self:flex-start;max-width:88%;background:#16644B;border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:clamp(15px,2.4vw,19px);line-height:1.45;transform-origin:left bottom;animation:pop .35s cubic-bezier(.2,1.5,.4,1) both}
.bub time{display:block;text-align:right;font-size:11px;color:#F7EFD899;margin-top:3px}
.bub time em{color:#E8B84A;font-style:normal}
.typing{align-self:flex-start;background:#16644B;border-radius:16px 16px 16px 4px;padding:13px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#F7EFD8aa;animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-4px);opacity:.5}}
#car{position:relative;width:min(94vw,760px);height:min(58vh,430px);touch-action:pan-y;user-select:none}
.pc{position:absolute;left:50%;top:50%;width:min(52vw,280px);aspect-ratio:3/4;margin:0;border:8px solid #F7EFD8;border-radius:10px;overflow:hidden;background:#0F4D3A;box-shadow:0 20px 50px #00000066;transition:transform .8s cubic-bezier(.3,.8,.3,1),opacity .8s,filter .8s}
.pc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
#cap{min-height:34px;margin-top:10px;font-size:clamp(16px,3vw,22px);font-weight:700;color:var(--gold)}
#dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
#dots i{width:7px;height:7px;border-radius:50%;background:#F7EFD833;transition:.3s}
#dots i.on{background:var(--gold);transform:scale(1.4)}
.nv{position:absolute;top:50%;z-index:20;width:44px;height:44px;margin:-22px 0 0;padding:0;border-radius:50%;background:#0B3D2Ecc;color:var(--ink);font-size:24px;border:1px solid #F7EFD844}
#pv{left:0}#nx{right:0}
.bd{position:absolute;left:calc(-32px*var(--k,1));top:calc(-32px*var(--k,1));width:calc(64px*var(--k,1));text-align:center;transform:translate(var(--sx),var(--sy)) scale(.3) rotate(-90deg);opacity:0;transition:transform 1.9s cubic-bezier(.2,1.25,.3,1) var(--d),opacity .6s var(--d)}
.bd.in{transform:translate(var(--tx),var(--ty));opacity:1}
.bd i{display:grid;place-items:center;width:calc(64px*var(--k,1));height:calc(64px*var(--k,1));border-radius:50%;background:var(--c);color:#0B3D2E;font:800 calc(26px*var(--k,1)) "Bricolage Grotesque",system-ui,sans-serif;font-style:normal;border:3px solid #F7EFD8;box-shadow:0 8px 20px #00000055}
.bd.in i{animation:fl 2.4s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes fl{to{transform:translateY(-7px)}}
.bd span{display:block;font-size:calc(13px*var(--k,1));font-weight:700;white-space:nowrap;margin:5px -20px 0}
#say{position:absolute;left:0;top:0;transform:translate(-50%,-50%);text-align:center;font-weight:800;line-height:1.08;letter-spacing:-.02em}
#say .p{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
#say svg{width:56px;height:52px;display:block;margin:0 auto 8px;animation:beat .9s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.2)}}
.curt{position:fixed;top:0;bottom:0;width:51%;z-index:50;transition:transform 2.6s cubic-bezier(.6,0,.2,1);background:repeating-linear-gradient(90deg,#062A1F 0 26px,#0A3B2B 26px 52px,#062A1F 52px 70px);box-shadow:inset 0 0 90px #000a}
#cl{left:0;transform:translateX(-100%);border-right:3px solid #E8B84A}#cr{right:0;transform:translateX(100%);border-left:3px solid #E8B84A}
.closed{transform:none!important}
#bye{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;transition:opacity 2s;pointer-events:none}
#bye.on{opacity:1;pointer-events:auto}
#bye h1{color:var(--gold);text-shadow:0 0 40px #E8B84Aaa}
@media (prefers-reduced-motion:reduce){.balloon,.conf{animation-duration:2s!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="curt" id="cl"></div><div class="curt" id="cr"></div>
<div id="bye"><h1>See you on the next one.</h1><button id="again">Watch again</button></div>

    { name: "Israel", full: "Ayoola Israel", file: "", up: "Israel has this to say", hype: "Ready…", go: "GO!",
      msg: `Engr. Feranmi,
I can already tell what you will do when you read this and all of the wishes from everyone. Your first instinct will be to deflect; to say you have not done anything, or that all the kind words people are sending are just a normal thing. Unfortunately, this is me insisting on how much you matter. It is almost as though God blessed all of us with you specifically. Such a gem! 💎
Your life has also proven, in ways more soothing than words, that God gives gifts in human form. Maybe that is why I fondly call you “Feranmi”, because it is really true. 🎁 Thank you for being a true brother to me. We have had our reasons to argue, and we have laughed together, ruminated on things together, prayed together, and you have pushed me to do better. You have even made me an ad hoc engineer at times. 😄 We have eaten together too, and in fact, you were the first person who ever took me to Chicken Republic. 🍗😅
Some of the things I cherish most about you are how dearly you love, how hard you work, and how truly you care. Somehow, my living in Ibadan has been made easy by you in so many ways: the many random gistings, the outings, and those days you quietly put something into my pocket. 🤝
As I say these few words, I just want you to know that none of them are random acts, and none of them are minor things. They reflect how special you are and how intentional you are. ❤️
So, as you step into this new phase of being 30, I pray that the Lord grounds you more deeply in Him, that He causes His face to continually shine upon you, that He helps you trust in Him always, and that you will forever have reasons to triumph in Him. 🙏✨
Happy Birthday, My Guy! 🎂🎉
Cheers! 🥂` },

const $ = s => document.querySelector(s), app = $('#app');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const scene = h => { app.innerHTML = '<div class="scene">' + h + '</div>'; };
const click = label => new Promise(r => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { b.remove(); r(); }; app.firstElementChild.appendChild(b); });
const COLS = ['#E8B84A', '#F7EFD8', '#F2D27A', '#3FA37F', '#D9A03A', '#FFFFFF'];

let live = 0, waiters = [];
const balloonsGone = () => new Promise(r => live ? waiters.push(r) : r());
function balloons(n) {
  live += n;
  for (let i = 0; i < n; i++) setTimeout(() => {
    const b = document.createElement('div'); b.className = 'balloon'; let fin = false;
    const done = () => { if (fin) return; fin = true; b.remove(); if (--live <= 0) { live = 0; waiters.splice(0).forEach(f => f()); } };
    b.style.cssText = `left:${rnd(-2, 98)}%;--c:${COLS[i % 6]};--d:${rnd(3.5, 7)}s;--sx:${rnd(-120, 120)}px;--rot:${rnd(-25, 25)}deg;transform:scale(${rnd(.8, 1.5)})`;
    b.addEventListener('animationend', done); setTimeout(done, 9000);
    document.body.appendChild(b);
  }, i * 90);
}
function burst(n = 90) {
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'), a = rnd(0, 6.28), d = rnd(160, Math.max(innerWidth, 500) * .6);
    c.className = 'conf';
    c.style.cssText = `left:50%;top:50%;background:${COLS[i % 6]};--d:${rnd(.9, 1.8)}s;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d + 120}px`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 2000);
  }
}

const PERSON = `<svg viewBox="0 0 64 108"><g class="lg lb"><path d="M32 62L40 82L33 101" fill="none" stroke="#CFC4A6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 104h12" stroke="#E8B84A" stroke-width="7" stroke-linecap="round"/></g><g class="am ab"><path d="M32 40L35 53" stroke="#B98E2C" stroke-width="8" stroke-linecap="round"/><path d="M35 53L41 63" stroke="#C98F65" stroke-width="6" stroke-linecap="round"/></g><path d="M23 38q9-6 18 0l1 27q-10 4-20 0z" fill="#E8B84A"/><rect x="29" y="27" width="7" height="10" rx="3" fill="#E0A97F"/><ellipse cx="33" cy="19" rx="9.5" ry="11" fill="#E0A97F"/><path d="M22.500 20c-2-10 4-15 11-14 7 0 11 6 9 13-3-5-8-7-13-6-3 1-5 3-7 7z" fill="#2E1F1A"/><circle cx="38" cy="20" r="1.300" fill="#2E1F1A"/><path d="M36 25q3 2 5 0" stroke="#8A4B3A" stroke-width="1.300" fill="none" stroke-linecap="round"/><g class="lg"><path d="M32 62L40 82L33 101" fill="none" stroke="#F7EFD8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 104h12" stroke="#E8B84A" stroke-width="7" stroke-linecap="round"/></g><g class="am"><path d="M32 40L35 53" stroke="#E8B84A" stroke-width="8" stroke-linecap="round"/><path d="M35 53L41 63" stroke="#E0A97F" stroke-width="6" stroke-linecap="round"/></g></svg>`;
const climber = () => (C.climberImage || PHOTO) ? `<img src="${C.climberImage || PHOTO}" alt="">` : PERSON;

async function splash() {
  const W = Math.min(150, innerWidth * .3), H = 62, N = C.turningAge;
  let steps = '<div class="ground"></div>';
  for (let i = 1; i <= N; i++) steps += `<div class="step" style="left:${(i - 1) * W}px;top:${-i * H}px;width:${W}px;height:${i * H + 3000}px">${i}</div>`;
  let stars = ''; for (let i = 0; i < 60; i++) stars += `<i class="star" style="left:${rnd(0, 100)}%;top:${rnd(0, 100)}%;animation-delay:${rnd(0, 2)}s"></i>`;
  scene(`${stars}<div id="count">0</div><div id="world">${steps}<div id="angel">${climber()}</div></div>`);
  const world = $('#world'), angel = $('#angel'), count = $('#count');
  const px = i => (i - .5) * W, py = i => -i * H;
  const AR = PHOTO_AR, h0 = 34, hN = Math.min(210, innerHeight * .3);
  const place = (i, dur) => {
    const cx = innerWidth * .5, cy = innerHeight * .68, hh = h0 + (hN - h0) * (i / N), ww = hh * AR;
    world.style.transition = `transform ${dur}s cubic-bezier(.4,0,.2,1)`;
    angel.style.transition = `left ${dur}s linear, top ${dur}s cubic-bezier(.3,1.4,.5,1), width ${dur}s ease, height ${dur}s ease`;
    world.style.transform = `translate(${cx - px(i)}px,${cy - py(i)}px)`;
    angel.style.width = ww + 'px'; angel.style.height = hh + 'px';
    angel.style.left = px(i) - ww / 2 + 'px'; angel.style.top = py(i) - hh + 3 + 'px';
  };
  place(0, 0); await sleep(900);
  for (let i = 1; i <= N; i++) {
    const slow = i <= 5, dur = slow ? 1.1 : .17;
    count.textContent = i; count.classList.remove('pop'); void count.offsetWidth; count.classList.add('pop');
    place(i, dur); await sleep(dur * 1000 + (slow ? 450 : 20));
  }
  const wrap = document.createElement('div'); wrap.id = 'welcome';
  wrap.innerHTML = ['WELCOME', 'TO', '30'].map((w, k) => `<div class="w ${k == 2 ? 'n' : ''}">${[...w].map(ch => `<span class="l" style="--x:${rnd(-70, 70)}vw;--y:${rnd(-60, 60)}vh;--r:${rnd(-500, 500)}deg;animation-delay:${rnd(0, .8)}s">${ch}</span>`).join('')}</div>`).join('');
  app.firstElementChild.appendChild(wrap);
  balloons(26); await sleep(1300); burst(110); balloons(26); await sleep(1900); balloons(20); await sleep(1800);
  await balloonsGone();
}

const HEART_UNUSED = '<svg viewBox="0 0 24 22"><path d="M12 21S2 14 2 7.5A5.5 5.5 0 0 1 12 4a5.5 5.5 0 0 1 10 3.5C22 14 12 21 12 21z" fill="#FF7A9C"/></svg>';
async function card(name, msg, last) {
  const c = COLS[[...name].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 6];
  const raw = (msg || `Add ${name}'s message in the settings at the top of the file.`).trim();
  let parts = raw.split(/\n+/).map(x => x.trim()).filter(Boolean);
  if (parts.length === 1) parts = raw.replace(/\s+/g, ' ').split(/(?<=[.!?])\s+/);
  scene(`<div class="chat"><div class="chead"><div class="cav" style="--c:${c}">${name[0]}</div><div><b>${name}</b><small id="st">online</small></div></div><div class="cbody" id="cb"></div></div>`);
  burst(40);
  const cb = $('#cb'), st = $('#st'), time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  await sleep(600);
  for (let i = 0; i < parts.length; i++) {
    st.textContent = 'typing…';
    cb.insertAdjacentHTML('beforeend', '<div class="typing"><i></i><i></i><i></i></div>');
    $('.chat').scrollTop = 9999;
    await sleep(Math.min(1600, 400 + parts[i].length * 12));
    cb.querySelector('.typing').remove();
    cb.insertAdjacentHTML('beforeend', `<div class="bub">${parts[i]}${i == parts.length - 1 ? `<time>${time} <em>✓✓</em></time>` : ''}</div>`);
    $('.chat').scrollTop = 9999;
    await sleep(500);
  }
  st.textContent = 'online';
  return click(last ? 'Continue' : 'Next');
}

function playVid(src, label, msg) {
  return new Promise(res => {
    scene(`<div class="vwrap">${label ? `<div class="tag">${label}</div>` : ''}<video playsinline controls src="${encodeURI(src)}"></video></div>`);
    const v = $('video'); let done = false;
    const fin = () => { if (!done) { done = true; res(); } };
    const fallback = () => {
      if (done) return;
      if (msg) { card(label, msg).then(fin); return; }
      scene(`<div class="ph">Add <b>${src}</b> in the same folder as this page</div>`);
      click('Continue').then(fin);
    };
    v.onended = fin; v.onerror = fallback;
    if (!src) return fallback();
    v.play().catch(() => {});
  });
}

  const names = [...C.videos.map(v => v.short), ...C.friends, ...C.closing].map(f => typeof f === 'string' ? f : (f.short || f.name.split(' ')[0])), n = names.length, R = Math.min(300, Math.min(innerWidth, innerHeight) * .39), k = Math.max(.6, Math.min(1, 6.283 * R / n / 80));

function ask(q) {
  return new Promise(res => {
    scene(`<h1>${q}</h1><div class="row"><button id="yes">Yes</button><button id="no" class="no">No</button></div><p id="taunt"></p>`);
    const yes = $('#yes'), no = $('#no'), t = $('#taunt');
    const T = ["Hmm… that button seems shy.", "Oops. It moved. Weird.", "Okay okay. Are you sure?", "I know, I know… but you have to listen.", "They really worked hard on this.", "Fine. The No button has left the chat.", "Just press Yes. You know you want to."];
    let n = 0, last = 0;
    const dodge = e => {
      e.preventDefault();
      if (Date.now() - last < 400) return; last = Date.now();
      if (!no.classList.contains('run')) { const r = no.getBoundingClientRect(); no.style.left = r.left + 'px'; no.style.top = r.top + 'px'; no.classList.add('run'); void no.offsetWidth; }
      no.style.left = rnd(12, Math.max(13, innerWidth - no.offsetWidth - 12)) + 'px';
      no.style.top = rnd(70, Math.max(71, innerHeight - no.offsetHeight - 12)) + 'px';
      t.textContent = T[Math.min(n, T.length - 1)]; n++;
      if (n > 3) { no.style.transform = `scale(${Math.max(.5, 1 - n * .07)})`; yes.style.transform = `scale(${Math.min(1.5, 1 + n * .07)})`; }
    };
    ['pointerenter', 'pointerdown', 'click'].forEach(ev => no.addEventListener(ev, dodge));
    yes.onclick = () => res();
  });
}

async function gallery() {

  if (!list.length) return;
  scene(`<h1>A little walk down memory lane…</h1>`); await sleep(2600);
  scene(`<p class="small">Memory lane</p><div id="car">${list.map((p, i) => `<figure class="pc"><img src="${p.url}" alt=""></figure>`).join('')}<button class="nv" id="pv" aria-label="Previous">‹</button><button class="nv" id="nx" aria-label="Next">›</button></div><div id="cap"></div><div id="dots">${list.map(() => '<i></i>').join('')}</div>`);
  const cards = [...document.querySelectorAll('.pc')], dots = [...document.querySelectorAll('#dots i')], cap = $('#cap');
  let cur = 0, timer, shown = false, finish; const done = new Promise(r => finish = r);
  const show = () => {
    cards.forEach((c, i) => {
      const d = i - cur, a = Math.abs(d);
      c.style.transform = `translate(calc(-50% + ${d * 62}%),-50%) scale(${1 - Math.min(a, 3) * .15}) rotate(${d * 4}deg)`;
      c.style.opacity = a > 2 ? 0 : 1 - a * .25; c.style.zIndex = 10 - a; c.style.filter = a ? 'brightness(.55)' : 'none';
    });
    dots.forEach((d, i) => d.classList.toggle('on', i === cur));

    if (cur === list.length - 1 && !shown) { shown = true; setTimeout(() => click('Continue').then(() => { clearInterval(timer); finish(); }), 900); }
  };
  const go = d => { cur = (cur + d + list.length) % list.length; show(); };
  const auto = () => { clearInterval(timer); timer = setInterval(() => go(1), 2800); };
  $('#pv').onclick = () => { go(-1); auto(); }; $('#nx').onclick = () => { go(1); auto(); };
  let x0 = null; const car = $('#car');
  car.onpointerdown = e => { x0 = e.clientX; };
  car.onpointerup = e => { if (x0 !== null && Math.abs(e.clientX - x0) > 40) { go(e.clientX < x0 ? 1 : -1); auto(); } x0 = null; };
  show(); auto();
  await done;
}

async function run() {
  if (location.hash === '#gallery') { await gallery(); return; } // quick preview: add #gallery to the page address

  for (const t of C.intro.slice(0, -1)) { scene(`<h1>${t}</h1>`); await sleep(2600); }

  for (let fi = 0; fi < C.friends.length; fi++) {

  for (let ci = 0; ci < C.closing.length; ci++) await showFriend(C.closing[ci], ci === C.closing.length - 1);
  await finale();
}
